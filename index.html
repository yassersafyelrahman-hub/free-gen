<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استوديو التوليد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0d0a; --panel: #1a1611; --line: #33291c; --text: #f3ead9; --muted: #a89a82;
    --gold: #d9a441; --gold-2: #f0c46a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Cairo", system-ui, sans-serif; line-height: 1.6; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  h1 { font-size: 1.6rem; margin: 8px 0 2px; color: var(--gold-2); }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .lang { flex: none; margin-top: 8px; padding: 6px 14px; border: 1px solid var(--line); background: var(--panel);
          color: var(--text); border-radius: 999px; font: inherit; font-size: .85rem; cursor: pointer; }
  .lang:hover { border-color: var(--gold); }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab { flex: 1; padding: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--muted);
         border-radius: 10px; font: inherit; cursor: pointer; }
  .tab[aria-selected="true"] { color: #1a1204; background: var(--gold); border-color: var(--gold); font-weight: 700; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  textarea { width: 100%; min-height: 96px; resize: vertical; background: #120f0b; color: var(--text);
             border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: inherit; }
  textarea:focus, select:focus, input:focus, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
  select, input[type=number] { background: #120f0b; color: var(--text); border: 1px solid var(--line);
             border-radius: 8px; padding: 8px 10px; font: inherit; min-width: 130px; }
  .count { margin-inline-start: auto; font-size: .8rem; color: var(--muted); }
  button.go { margin-top: 14px; width: 100%; padding: 13px; border: 0; border-radius: 10px; background: var(--gold);
              color: #1a1204; font: inherit; font-weight: 700; font-size: 1.05rem; cursor: pointer; }
  button.go:disabled { opacity: .5; cursor: wait; }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: .92rem; display: none; }
  .msg.err { display: block; background: #3a1a16; color: #ffb3a8; border: 1px solid #6b2a22; }
  .msg.info { display: block; background: #1d2418; color: #c8e6c4; border: 1px solid #34502f; }
  .tip { color: var(--muted); font-size: .82rem; margin-top: 10px; }
  h2 { font-size: 1.1rem; margin: 28px 0 10px; color: var(--gold-2); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .card img, .card video { width: 100%; display: block; background: #000; aspect-ratio: 1/1; object-fit: cover; }
  .card .meta { padding: 8px 10px; font-size: .8rem; color: var(--muted); display: flex; gap: 8px; justify-content: space-between; align-items: center; }
  .card .meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .card a { color: var(--gold-2); text-decoration: none; font-weight: 600; white-space: nowrap; }
  .skeleton { aspect-ratio: 1/1; background: linear-gradient(90deg, #1a1611, #2a2217, #1a1611); background-size: 200% 100%;
              animation: sh 1.4s infinite linear; }
  @keyframes sh { to { background-position: -200% 0; } }
  .empty { color: var(--muted); font-size: .9rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 data-i18n="title">استوديو التوليد</h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <button class="lang" id="langbtn" type="button" aria-label="Language / اللغة"></button>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-image" aria-selected="true" data-i18n="tabImage"></button>
    <button class="tab" role="tab" id="tab-video" aria-selected="false" data-i18n="tabVideo"></button>
  </div>

  <div class="panel">
    <textarea id="prompt" dir="auto" maxlength="500" data-i18n-ph="promptPh"></textarea>
    <div class="row">
      <div class="row" id="image-opts" style="margin:0">
        <label><span data-i18n="size"></span>
          <select id="size">
            <option value="1024x1024" data-i18n="sizeSquare"></option>
            <option value="1344x768" data-i18n="sizeLand"></option>
            <option value="768x1344" data-i18n="sizePort"></option>
          </select>
        </label>
        <label><span data-i18n="model"></span>
          <select id="model"></select>
        </label>
      </div>
      <label><span data-i18n="seed"></span>
        <input type="number" id="seed" min="0" max="999999999" data-i18n-ph="seedPh">
      </label>
      <span class="count"><span id="cnt">0</span>/500</span>
    </div>
    <button class="go" id="go" type="button" data-i18n="go"></button>
    <div class="msg" id="msg" role="status"></div>
    <p class="tip" data-i18n="tip"></p>
  </div>

  <h2 data-i18n="works"></h2>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" data-i18n="empty"></p>
  <p class="tip" id="keep"></p>
</div>

<script>
const $ = id => document.getElementById(id);

/* ---------- translations ---------- */
const T = {
  ar: {
    title: 'استوديو التوليد',
    sub: 'اكتب وصف، واختار صورة أو فيديو. مجاني بالكامل.',
    tabImage: '🖼️ صورة', tabVideo: '🎬 فيديو',
    promptPh: 'مثال: a golden pharaoh mask glowing in a dark temple, cinematic lighting',
    size: 'المقاس', sizeSquare: 'مربع 1024×1024', sizeLand: 'عرضي 1344×768', sizePort: 'طولي 768×1344',
    model: 'الموديل', seed: 'Seed (اختياري)', seedPh: 'عشوائي',
    go: 'توليد',
    tip: 'نصيحة: الوصف بالإنجليزي بيدّي نتايج أدق في الغالب.',
    works: 'أعمالك', empty: 'لسه ما ولّدتش حاجة.', download: 'تحميل',
    keep: 'الأعمال بتتحفظ على السيرفر {h} ساعة، فحمّل اللي عايزه.',
    needPrompt: 'اكتب وصف الأول.',
    sending: 'بنبعت الطلب…', generating: 'بيتولّد…',
    queued: 'في الطابور… قدامك {n} طلب',
    running: 'بيتولّد الفيديو… ممكن ياخد من دقيقة لخمس دقايق.',
    'err.RATE_IMG': 'وصلت للحد الأقصى من الصور في الساعة. جرّب بعد شوية.',
    'err.BUSY': 'السيرفر مشغول دلوقتي، جرّب بعد ثواني.',
    'err.EMPTY_PROMPT': 'اكتب وصف الأول.',
    'err.IMG_UPSTREAM': 'خدمة الصور مش متاحة دلوقتي ({d}). جرّب تاني.',
    'err.IMG_TIMEOUT': 'الطلب أخد وقت طويل أو فشل. جرّب تاني.',
    'err.VID_DISABLED': 'توليد الفيديو لسه مش مفعّل على السيرفر.',
    'err.RATE_VID': 'وصلت للحد الأقصى من الفيديوهات في الساعة.',
    'err.QUEUE_FULL': 'الطابور ممتلئ، جرّب بعد شوية.',
    'err.NOT_FOUND': 'الطلب مش موجود.',
    'err.BAD_REQUEST': 'طلب غير صالح.',
    'err.VID_REJECTED': 'الـ Space رفض الطلب ({d}). راجع spaceUrl و apiName في config.json.',
    'err.VID_QUOTA': 'الـ Space رجّع خطأ، وغالبًا خلصت حصة الـ GPU المجانية اليومية.',
    'err.VID_NO_RESULT': 'الـ Space ما رجّعش نتيجة.',
    'err.VID_NO_FILE': 'ما لقيتش ملف فيديو في رد الـ Space. راجع apiName و inputs.',
    'err.VID_DOWNLOAD': 'فشل تحميل الفيديو من الـ Space.',
    'err.VID_TIMEOUT': 'توليد الفيديو أخد وقت أطول من المسموح.',
    'err.VID_UNKNOWN': 'حصل خطأ غير متوقع.',
    'err.GENERIC': 'حصل خطأ، جرّب تاني.'
  },
  en: {
    title: 'Generation Studio',
    sub: 'Describe what you want, then pick image or video. Completely free.',
    tabImage: '🖼️ Image', tabVideo: '🎬 Video',
    promptPh: 'Example: a golden pharaoh mask glowing in a dark temple, cinematic lighting',
    size: 'Size', sizeSquare: 'Square 1024×1024', sizeLand: 'Landscape 1344×768', sizePort: 'Portrait 768×1344',
    model: 'Model', seed: 'Seed (optional)', seedPh: 'Random',
    go: 'Generate',
    tip: 'Tip: mention the subject, style and lighting for better results.',
    works: 'Your creations', empty: 'Nothing generated yet.', download: 'Download',
    keep: 'Creations are kept on the server for {h} hours, so download what you want to keep.',
    needPrompt: 'Write a prompt first.',
    sending: 'Sending your request…', generating: 'Generating…',
    queued: 'In the queue… {n} request(s) ahead of you',
    running: 'Generating your video… this can take 1–5 minutes.',
    'err.RATE_IMG': 'You have reached the hourly image limit. Try again later.',
    'err.BUSY': 'The server is busy right now. Try again in a few seconds.',
    'err.EMPTY_PROMPT': 'Write a prompt first.',
    'err.IMG_UPSTREAM': 'The image service is unavailable right now ({d}). Try again.',
    'err.IMG_TIMEOUT': 'The request took too long or failed. Try again.',
    'err.VID_DISABLED': 'Video generation is not enabled on this server yet.',
    'err.RATE_VID': 'You have reached the hourly video limit.',
    'err.QUEUE_FULL': 'The queue is full. Try again shortly.',
    'err.NOT_FOUND': 'Request not found.',
    'err.BAD_REQUEST': 'Invalid request.',
    'err.VID_REJECTED': 'The video Space rejected the request ({d}). Check spaceUrl and apiName in config.json.',
    'err.VID_QUOTA': 'The video Space returned an error; the daily free GPU quota has probably run out.',
    'err.VID_NO_RESULT': 'The Space returned no result.',
    'err.VID_NO_FILE': 'No video file found in the Space response. Check apiName and inputs.',
    'err.VID_DOWNLOAD': 'Failed to download the video from the Space.',
    'err.VID_TIMEOUT': 'Video generation took longer than allowed.',
    'err.VID_UNKNOWN': 'Something went wrong.',
    'err.GENERIC': 'Something went wrong. Try again.'
  }
};

const LANG_KEY = 'freegen.lang';
let lang = (() => {
  try { const s = localStorage.getItem(LANG_KEY); if (s === 'ar' || s === 'en') return s; } catch {}
  return (navigator.language || '').toLowerCase().startsWith('ar') ? 'ar' : 'en';
})();
const t = (k, vars = {}) =>
  (T[lang][k] ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (_, v) => (vars[v] ?? ''));

/* ---------- state ---------- */
let mode = 'image';
let cfg = { videoEnabled: false, imageModels: ['flux'], retentionHours: 24 };
let msgState = null; // { key, kind, vars } so the message can be re-rendered when the language changes
const KEY = 'freegen.history.v1';
const history = (() => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; } })();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(history.slice(0, 40))); } catch {} };

function renderMsg() {
  const m = $('msg');
  if (!msgState) { m.className = 'msg'; m.textContent = ''; return; }
  m.className = 'msg ' + msgState.kind;
  m.textContent = t(msgState.key, msgState.vars);
}
function setMsg(key, kind, vars) { msgState = key ? { key, kind, vars } : null; renderMsg(); }
const errKey = code => (('err.' + code) in T.en ? 'err.' + code : 'err.GENERIC');

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  $('keep').textContent = t('keep', { h: cfg.retentionHours });
  $('langbtn').textContent = lang === 'ar' ? 'English' : 'العربية';
  renderMsg();
}
$('langbtn').onclick = () => {
  lang = lang === 'ar' ? 'en' : 'ar';
  try { localStorage.setItem(LANG_KEY, lang); } catch {}
  applyLang();
};

/* ---------- UI ---------- */
function setMode(m) {
  mode = m;
  $('tab-image').setAttribute('aria-selected', m === 'image');
  $('tab-video').setAttribute('aria-selected', m === 'video');
  $('image-opts').hidden = m !== 'image';
  setMsg(null);
  if (m === 'video' && !cfg.videoEnabled) setMsg('err.VID_DISABLED', 'err');
}
$('tab-image').onclick = () => setMode('image');
$('tab-video').onclick = () => setMode('video');
$('prompt').oninput = e => { $('cnt').textContent = e.target.value.length; };

function addCard(item) {
  $('empty').hidden = true;
  const card = document.createElement('div');
  card.className = 'card';
  const media = document.createElement(item.type === 'video' ? 'video' : 'img');
  media.src = item.url;
  if (item.type === 'video') { media.controls = true; media.loop = true; media.playsInline = true; media.preload = 'metadata'; }
  else { media.alt = item.prompt; media.loading = 'lazy'; }
  media.onerror = () => {
    card.remove();
    const i = history.findIndex(h => h.url === item.url);
    if (i > -1) { history.splice(i, 1); save(); }
    if (!$('grid').children.length) $('empty').hidden = false;
  };
  const meta = document.createElement('div');
  meta.className = 'meta';
  const p = document.createElement('span'); p.textContent = item.prompt; p.title = item.prompt; p.dir = 'auto';
  const a = document.createElement('a'); a.href = item.url; a.download = ''; a.dataset.i18n = 'download'; a.textContent = t('download');
  meta.append(p, a);
  card.append(media, meta);
  $('grid').prepend(card);
}
function placeholder() {
  const c = document.createElement('div'); c.className = 'card'; c.innerHTML = '<div class="skeleton"></div>';
  $('grid').prepend(c); $('empty').hidden = true; return c;
}

/* ---------- API ---------- */
class ApiError extends Error { constructor(code, detail) { super(code); this.code = code; this.detail = detail; } }
async function postJson(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new ApiError(data.error || 'GENERIC', data.detail);
  return data;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

function generateImage(prompt, seed) {
  const [width, height] = $('size').value.split('x').map(Number);
  const body = { prompt, width, height, model: $('model').value };
  if (seed !== null) body.seed = seed;
  return postJson('/api/image', body);
}
async function generateVideo(prompt, seed) {
  const body = { prompt }; if (seed !== null) body.seed = seed;
  const { id } = await postJson('/api/video', body);
  for (;;) {
    await sleep(3000);
    const r = await fetch('/api/video/' + id);
    const s = await r.json().catch(() => ({}));
    if (s.status === 'done') return s;
    if (s.status === 'error' || !r.ok) throw new ApiError(s.error || 'GENERIC', s.detail);
    if (s.status === 'queued') setMsg('queued', 'info', { n: s.ahead });
    else setMsg('running', 'info');
  }
}

$('go').onclick = async () => {
  const prompt = $('prompt').value.trim();
  if (!prompt) return setMsg('needPrompt', 'err');
  if (mode === 'video' && !cfg.videoEnabled) return setMsg('err.VID_DISABLED', 'err');
  const seedVal = $('seed').value.trim();
  const seed = seedVal === '' ? null : parseInt(seedVal, 10);
  $('go').disabled = true;
  setMsg(mode === 'image' ? 'generating' : 'sending', 'info');
  const ph = placeholder();
  try {
    const out = mode === 'image' ? await generateImage(prompt, seed) : await generateVideo(prompt, seed);
    const item = { type: mode, url: out.url, prompt };
    ph.remove(); addCard(item);
    history.unshift(item); save();
    setMsg(null);
  } catch (e) {
    ph.remove();
    if (!$('grid').children.length) $('empty').hidden = false;
    if (e instanceof ApiError) setMsg(errKey(e.code), 'err', { d: e.detail ?? '' });
    else setMsg('err.GENERIC', 'err');
  } finally {
    $('go').disabled = false;
  }
};

/* ---------- init ---------- */
(async () => {
  try { cfg = await (await fetch('/api/config')).json(); } catch {}
  $('model').innerHTML = '';
  cfg.imageModels.forEach(m => { const o = document.createElement('option'); o.textContent = m; $('model').append(o); });
  history.slice().reverse().forEach(addCard);
  applyLang();
})();
applyLang();
</script>
</body>
</html>
